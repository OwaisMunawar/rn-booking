name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Includes coverage thresholds for packages/shared (see its vitest.config.ts).
      - run: npm test
      - run: npm run build:admin
      - run: npm run export:mobile

  admin-e2e:
    name: Admin smoke tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run build:admin
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/admin/test-results
          retention-days: 7

  database:
    name: Migrations, RLS and repository integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1
      - run: npm ci
      # Applies every migration and supabase/seed.sql to a fresh local stack.
      - run: supabase start
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          # Compare formatted output so CLI formatting changes don't read as drift.
          npx prettier --stdin-filepath x.ts < packages/shared/src/database.types.ts > /tmp/committed.ts
          npx prettier --stdin-filepath x.ts < /tmp/database.types.ts > /tmp/generated.ts
          diff -u /tmp/committed.ts /tmp/generated.ts
      - run: npm run test:integration
